<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessment Attempts</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2430; --muted: #6b7585; --line: #e3e7ee;
    --brand: #1F4E79; --pass: #1e8e4e; --fail: #c0392b; --warn: #b7791f; --hold: #6c5ce7; --dis: #d35400;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  main { padding: 12px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  label.inline { display: flex; align-items: center; gap: 8px; margin: 10px 0 0; font-size: 14px; color: var(--text); }
  input, select, textarea { font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input[type=checkbox] { width: 18px; height: 18px; padding: 0; }
  select, input[type=text], input[type=password], input[type=date], textarea { width: 100%; }
  textarea { font-family: inherit; min-height: 140px; resize: vertical; }
  button { font-size: 15px; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  button.pass { background: var(--pass); }
  button.fail { background: var(--fail); }
  button.abs { background: var(--warn); }
  button.hold { background: var(--hold); }
  button.dis { background: var(--dis); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { background: #fff; color: var(--text); border: 1px solid var(--line); padding: 8px 10px; font-size: 14px; }
  .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tabs.sub { margin-top: -4px; }
  .tabs.sub button { font-size: 13px; padding: 6px 10px; }
  .exportBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  .bulk select { width: auto; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .row:last-child { border-bottom: 0; }
  .who { display: flex; align-items: center; gap: 10px; }
  .name { font-weight: 600; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eef2f7; color: var(--muted); white-space: nowrap; }
  .chip.bad { background: #fbe3e0; color: var(--fail); font-weight: 600; }
  .chip.good { background: #e0f4e8; color: var(--pass); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions button { padding: 8px 10px; font-size: 14px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; }
  .count { background: #eef2f7; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .count b { display: block; font-size: 18px; color: var(--text); }
  .msg { font-size: 14px; min-height: 20px; margin-top: 8px; color: var(--pass); }
  .msg.err { color: var(--fail); }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .mh { margin: 16px 0 6px; font-size: 16px; }
  .mrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mrow input, .mrow select { width: auto; min-width: 120px; font-size: 14px; padding: 8px; }
  .mrow select.wide { min-width: 240px; }
  .mrow input[type=date] { min-width: 150px; }
  .clsName { min-width: 170px; font-weight: 600; }
  .bulkBox { background: #f7f9fc; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; margin: 8px 0 12px; }
  .bulkBox input { width: 100%; }
  .yearBar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .yearBar select { width: auto; min-width: 180px; }
  .tableWrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  table.dash { border-collapse: collapse; font-size: 14px; width: 100%; background: #fff; }
  table.dash th, table.dash td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; white-space: nowrap; vertical-align: top; }
  table.dash th { background: #f3f5f8; font-weight: 600; font-size: 13px; color: var(--text); }
  table.dash td.sname { font-weight: 600; position: sticky; left: 0; background: #fff; }
  table.dash tr.tot td { background: #f3f5f8; font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .dates { font-size: 13px; color: var(--muted); }
  .newBar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  dialog { border: 0; border-radius: 12px; padding: 18px; width: min(460px, 92vw); color: var(--text); }
  dialog::backdrop { background: rgba(20, 30, 45, .45); }
  dialog textarea { min-height: 96px; margin-top: 6px; }
  .bar { height: 8px; background: #eef2f7; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar span { display: block; height: 100%; background: var(--pass); }
  table.assess td.code { font-weight: 700; color: var(--brand); }
  .cell { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 250px; }
  .cell select, .cell input { width: auto; min-width: 110px; font-size: 14px; padding: 6px; }
  .cell input[type=date] { min-width: 130px; }
  button.xs { font-size: 13px; padding: 5px 9px; }
  .stageTabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .stageTabs button { background: #fff; color: var(--text); border: 1px solid var(--line); padding: 8px 12px; font-size: 14px; }
  .stageTabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
</style>
</head>
<body>

<header>
  <h1>Assessment Attempts</h1>
  <div style="display:flex; gap:10px; align-items:center">
    <div id="who" class="meta" style="color:#fff"></div>
    <button class="ghost" id="signOut" style="padding:6px 10px; font-size:13px; background:#fff">Sign out</button>
  </div>
</header>

<main>
  <!-- Sign-in -->
  <section id="gate" class="card">
    <label>Teacher name</label>
    <input id="gName" type="text" autocomplete="username">
    <label>PIN</label>
    <input id="gPin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <label class="inline"><input type="checkbox" id="gSeniorToggle"> I am the Senior</label>
    <div id="gSeniorBox" class="hidden">
      <label>Senior key</label>
      <input id="gSenior" type="password" autocomplete="off">
    </div>
    <button id="gBtn" style="margin-top:12px; width:100%">Sign in</button>
    <div id="gMsg" class="msg err"></div>
  </section>

  <!-- Main app -->
  <section id="app" class="hidden">
    <div class="card">
      <div class="yearBar">
        <label style="margin:0">Year</label>
        <select id="yearSel" class="hidden"></select>
        <span id="yearNote" class="meta"></span>
      </div>
    </div>

    <nav class="tabs" id="tabs"></nav>
    <nav class="tabs sub hidden" id="subtabs"></nav>

    <div class="card hidden" id="assessCard">
      <label>Assessment (competency · class)</label>
      <select id="assess"></select>
      <div id="counts" class="counts" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <!-- Bulk bar: shown on the Attempt lists -->
      <div id="bulk" class="bulk hidden">
        <label class="inline"><input type="checkbox" id="selAll"> Select all (<span id="selCount">0</span>)</label>
        <select id="bulkVal">
          <option value="">Set selected to…</option>
          <option value="Pass">Pass</option>
          <option value="Fail">Fail</option>
          <option value="Absent">Absent</option>
        </select>
        <button id="bulkApply">Apply</button>
      </div>
      <div id="list"></div>
    </div>
    <div id="msg" class="msg"></div>
  </section>
</main>

<!-- Comment / reason dialog (used for Fail, dispute) -->
<dialog id="dlg">
  <h3 id="dlgTitle" style="margin:0"></h3>
  <div id="dlgHint" class="meta"></div>
  <textarea id="dlgText"></textarea>
  <div id="dlgErr" class="msg err"></div>
  <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px">
    <button class="ghost" id="dlgCancel">Cancel</button>
    <button id="dlgOk">Save</button>
  </div>
</dialog>

<script>
// ----- settings -----
const APP_URL = "https://script.google.com/macros/s/AKfycbxC4vTVh4Ig-q4NWCMwWvyBXFKC8UkMD3aLTYmLPeRDO23iWmXdPYuC2qWZsjRpPaUO/exec";  // the web app URL, ends in /exec
const APP_KEY = "test123";        // same value as APP_KEY in Code.gs
// The Senior key is never stored in this page. The Senior types it at sign-in.

// The six classes, in display order
const CLASS_ORDER = ["Junior 1", "Junior 2", "Wheeler 1", "Wheeler 2", "Senior 1 - Utilities", "Senior 2 - Operation"];

// A new assessment is one competency, attached to every parallel class of its stage
const STAGE_OPTIONS = [
  { key: "Junior", label: "Junior (Junior 1 and Junior 2)", classes: ["Junior 1", "Junior 2"], match: c => c.stage === "Junior" },
  { key: "Wheeler", label: "Wheeler (Wheeler 1 and Wheeler 2)", classes: ["Wheeler 1", "Wheeler 2"], match: c => c.stage === "Wheeler" },
  { key: "Utilities", label: "Final year · Utilities", classes: ["Senior 1 - Utilities"], match: c => c.stage === "Senior" && c.dept === "Utilities" },
  { key: "Operation", label: "Final year · Operation", classes: ["Senior 2 - Operation"], match: c => c.stage === "Senior" && c.dept === "Operation" }
];

const TRIAL_ORDER = ["A", "B", "C", "D"];
const TEACHER_VIEWS = [
  ["mine", "My assessments"],
  ["A", "Attempt A"], ["B", "Attempt B"], ["C", "Attempt C"],
  ["hold", "On hold"], ["disputed", "Disputed"],
  ["pA", "Passed on A"], ["pB", "Passed on B"], ["pC", "Passed on C"]
];
// Senior screens: four tabs, each with sub-screens
const SENIOR_TABS = [["assess", "Assessments"], ["history", "History"], ["requests", "Requests"], ["settings", "Settings"]];
const SENIOR_SUBS = {
  assess: [["assess", "Setup"], ["A", "Attempt A"], ["B", "Attempt B"], ["C", "Attempt C"], ["D", "Attempt D"], ["passed", "Passed"]],
  history: [["hist-class", "By class"], ["hist-stage", "By stage"], ["hist-year", "By academic year"]],
  requests: [],
  settings: [["set-people", "Teachers & students"], ["set-classes", "Classes"]]
};
// Which tab each Senior screen belongs to
const TOP_OF = {
  assess: "assess", A: "assess", B: "assess", C: "assess", D: "assess", passed: "assess",
  requests: "requests",
  "hist-class": "history", "hist-stage": "history", "hist-year": "history",
  "set-people": "settings", "set-classes": "settings"
};

const S = {
  teacher: null, pin: null, senior: null, year: null,
  data: null, assessId: null, view: "mine",
  selected: new Set(), absentPick: null,
  manage: null, newAsm: null,
  stage: "Junior", dirty: false
};

// ----- helpers -----
const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const keyOf = s => String(s).replace(/\s+/g, "_");

function msg(text, isErr) {
  const m = el("msg");
  m.textContent = text || "";
  m.className = "msg" + (isErr ? " err" : "");
}

// Date arithmetic in UTC (the same rule the server uses for Attempts B, C, D)
function addDays(ymd, n) {
  const [y, m, d] = ymd.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

async function call(action, extra = {}) {
  const body = { key: APP_KEY, action, ...extra };
  if (S.senior) body.seniorKey = S.senior;
  else { body.teacher = S.teacher; body.pin = S.pin; }
  const t0 = performance.now();
  const res = await fetch(APP_URL, { method: "POST", body: JSON.stringify(body) });
  const out = await res.json();
  // Timing for speed checks: total wait here, and the part spent on the server (shown in the F12 console)
  console.info(`[timing] ${action}: ${Math.round(performance.now() - t0)} ms total, ${out.serverMs ?? "?"} ms on server`);
  if (out.timings) console.table(out.timings.map(([tab, rows, ms]) => ({ tab, rows, ms })));
  if (out.error) throw new Error(out.error);
  return out;
}

// Server action names: the Senior's versions start with "senior"
function act(name) {
  if (!S.senior) return name;
  return { record: "seniorRecord", recordMany: "seniorRecordMany", decide: "seniorDecide" }[name] || name;
}

// The Senior's year is sent with every load. Empty means the current year.
function loadData() {
  return S.senior ? call("seniorData", { year: S.year || "" }) : call("myData");
}

async function reload() {
  S.yearCache = null;
  S.data = await loadData();
  if (S.senior) S.year = S.data.year;
  persistData();
  render();
}

function saveSession() {
  sessionStorage.setItem("trials", JSON.stringify({ teacher: S.teacher, pin: S.pin, senior: S.senior, year: S.year }));
  persistData();
}

// Keep the last loaded data, so the next page open shows it instantly while it refreshes
function persistData() {
  if (S.data) sessionStorage.setItem("trialsData", JSON.stringify(S.data));
}

// Past years are read-only; only the current year can change
const canEdit = () => !S.senior || S.data.isCurrent !== false;

function compById(code) { return (S.data.competencies || []).find(c => c.code === code); }
function compName(code) { const c = compById(code); return c ? c.name : code; }
function assessLabel(a) { return `${compName(a.competency) || a.name} · ${a.cls}`; }
function datesText(dA) {
  return dA ? `B ${esc(addDays(dA, 1))} · C ${esc(addDays(dA, 2))} · D ${esc(addDays(dA, 3))}` : "Set the Attempt A date";
}
function classRank(c) { const i = CLASS_ORDER.indexOf(c); return i === -1 ? 99 : i; }

// A small dialog for a written reason (Fail, dispute). Resolves to the text, or null on cancel.
function askText(title, hint) {
  return new Promise(resolve => {
    el("dlgTitle").textContent = title;
    el("dlgHint").textContent = hint || "";
    el("dlgText").value = "";
    el("dlgErr").textContent = "";
    const dlg = el("dlg");
    el("dlgOk").onclick = () => {
      const t = el("dlgText").value.trim();
      if (!t) { el("dlgErr").textContent = "Please write the reason."; return; }
      dlg.close();
      resolve(t);
    };
    el("dlgCancel").onclick = () => { dlg.close(); resolve(null); };
    dlg.showModal();
    el("dlgText").focus();
  });
}

// ----- sign in -----
el("gSeniorToggle").onchange = e => el("gSeniorBox").classList.toggle("hidden", !e.target.checked);
el("gBtn").onclick = signIn;
el("gPin").addEventListener("keydown", e => { if (e.key === "Enter") signIn(); });

async function signIn() {
  el("gMsg").textContent = "";
  try {
    if (el("gSeniorToggle").checked) {
      S.senior = el("gSenior").value.trim();
      if (!S.senior) throw new Error("Type the Senior key.");
      S.teacher = "Senior"; S.pin = null; S.year = null;
      S.data = await loadData();
      S.year = S.data.year;
      resetView("assess");
    } else {
      S.senior = null;
      S.teacher = el("gName").value.trim();
      S.pin = el("gPin").value.trim();
      if (!S.teacher || !S.pin) throw new Error("Type your name and PIN.");
      S.data = await loadData();
      S.teacher = S.data.teacher;
    }
    S.manage = null;
    if (!S.senior) resetView("mine");
    saveSession();
    showApp();
  } catch (e) {
    S.senior = null;
    el("gMsg").textContent = e.message;
  }
}

el("signOut").onclick = () => {
  sessionStorage.removeItem("trials");
  sessionStorage.removeItem("trialsData");
  location.reload();
};

// ----- app -----
function showApp() {
  el("gate").classList.add("hidden");
  el("app").classList.remove("hidden");
  el("who").textContent = S.senior ? "Senior" : S.teacher;
  renderYearBar();

  const list = S.data.assessments;
  el("assess").innerHTML = list.map(a =>
    `<option value="${esc(a.id)}">${esc(assessLabel(a))}</option>`).join("");
  if (list.length && (!S.assessId || !list.some(a => a.id === S.assessId))) {
    S.assessId = list[0].id;
  }
  if (S.assessId) el("assess").value = S.assessId;
  render();
}

function renderYearBar() {
  if (S.senior) {
    el("yearSel").innerHTML = S.data.years.map(y =>
      `<option value="${esc(y.year)}" ${y.year === S.data.year ? "selected" : ""}>${esc(y.year)}${y.status === "Current" ? " (current)" : ""}</option>`).join("");
    el("yearSel").classList.remove("hidden");
    el("yearNote").textContent = S.data.isCurrent ? "Current year: you can change everything" : "Past year: read-only";
  } else {
    el("yearSel").classList.add("hidden");
    el("yearNote").textContent = "Year " + S.data.year;
  }
}

el("yearSel").onchange = async e => {
  S.year = e.target.value;
  S.assessId = null;
  S.manage = null;
  S.newAsm = null;
  S.selected = new Set();
  try {
    msg("Loading year…");
    S.data = await loadData();
    S.year = S.data.year;
    persistData();
    saveSession();
    showApp();
    msg("");
  } catch (err) {
    msg(err.message, true);
  }
};

el("assess").onchange = e => { S.assessId = e.target.value; resetView("A"); render(); };

function resetView(view) {
  S.view = view;
  S.selected = new Set();
  S.absentPick = null;
  S.newAsm = null;
}

function assessById(id) { return S.data.assessments.find(a => a.id === id); }

// Can this attempt take a result now? (Open, not locked for the teacher, year editable)
function canAct(x, a) {
  if (!canEdit()) return false;
  if (x.status !== "Open") return false;
  if (x.trial === "D" && !S.senior) return false;
  const date = a.dates[x.trial];
  if (date && date > S.data.today && !S.senior) return false;
  return true;
}

function listFor(view, rows) {
  if (view === "D") return rows.filter(x => x.trial === "D");          // every D result stays visible
  if (view === "hold") return rows.filter(x => x.status === "On hold");
  if (view === "disputed") return rows.filter(x => x.status === "Disputed");
  if (view === "passed") return rows.filter(x => x.status === "Passed");
  if (view[0] === "p") return rows.filter(x => x.trial === view[1] && x.status === "Passed");
  // Attempt A/B/C: open and waiting students for that attempt
  return rows.filter(x => x.trial === view && (x.status === "Open" || x.status === "Waiting"));
}

function render() {
  const senior = !!S.senior;
  if (senior && !(S.view in TOP_OF)) resetView("assess");
  if (!senior && !TEACHER_VIEWS.some(v => v[0] === S.view)) resetView("mine");

  const top = senior ? TOP_OF[S.view] : S.view;
  const reqCount = senior ? S.data.attempts.filter(x => x.status === "On hold" || x.status === "Disputed").length : 0;
  el("tabs").innerHTML = senior
    ? SENIOR_TABS.map(([key, label]) =>
      `<button data-view="${key}" class="${key === top ? "on" : ""}">${key === "requests" && reqCount ? `${label} (${reqCount})` : label}</button>`).join("")
    : TEACHER_VIEWS.map(([key, label]) =>
      `<button data-view="${key}" class="${key === S.view ? "on" : ""}">${label}</button>`).join("");

  const subs = senior ? SENIOR_SUBS[top] : [];
  el("subtabs").classList.toggle("hidden", !subs.length);
  el("subtabs").innerHTML = subs.map(([key, label]) =>
    `<button data-view="${key}" class="${key === S.view ? "on" : ""}">${label}</button>`).join("");

  // The assessment picker is only needed on attempt lists
  const plain = ["assess", "mine", "requests", "hist-class", "hist-stage", "hist-year", "set-people", "set-classes"];
  el("assessCard").classList.toggle("hidden", plain.includes(S.view));
  const showPlain = html => {
    el("counts").innerHTML = "";
    el("bulk").classList.add("hidden");
    el("list").innerHTML = html;
  };

  if (S.view === "assess") return showPlain(assessHtml());
  if (S.view === "mine") return showPlain(myAssessHtml());
  if (S.view === "requests") return showPlain(requestsHtml());
  if (S.view === "hist-class") return showPlain(dashboardHtml("class"));
  if (S.view === "hist-stage") return showPlain(dashboardHtml("stage"));
  if (S.view === "hist-year") {
    if (S.yearCache) return showPlain(yearTable(S.yearCache));
    showPlain(`<div class="empty">Loading academic years…</div>`);
    return loadYears();
  }
  if (S.view === "set-people") return showPlain(manageHtml());
  if (S.view === "set-classes") return showPlain(classesHtml());

  const a = assessById(S.assessId);
  if (!a) {
    el("counts").innerHTML = "";
    el("bulk").classList.add("hidden");
    el("list").innerHTML = `<div class="empty">${S.senior ? "No assessments in this year yet. Open Assessments to add one." : "No assessments are assigned to you yet."}</div>`;
    return;
  }

  const rows = S.data.attempts.filter(x => x.assessmentId === a.id);

  const attempts = S.senior ? TRIAL_ORDER : TRIAL_ORDER.slice(0, 3);
  el("counts").innerHTML = attempts.map(t => {
    const open = rows.filter(x => x.trial === t && x.status === "Open").length;
    const passed = rows.filter(x => x.trial === t && x.status === "Passed").length;
    return `<div class="count">Attempt ${t} open<b>${open}</b>${passed} passed</div>`;
  }).join("")
    + `<div class="count">Waiting for Senior<b>${rows.filter(x => x.status === "On hold" || x.status === "Disputed").length}</b></div>`
    + (S.senior ? `<div class="count">Failed final (Attempt D)<b>${rows.filter(x => x.trial === "D" && x.status === "Failed").length}</b>students</div>` : "");

  const items = listFor(S.view, rows);
  const isAttemptView = TRIAL_ORDER.indexOf(S.view) !== -1;
  const selectable = items.filter(x => canAct(x, a));

  // Forget selections for rows that are no longer selectable
  const ok = new Set(selectable.map(x => x.rowId));
  S.selected = new Set([...S.selected].filter(id => ok.has(id)));

  el("bulk").classList.toggle("hidden", !(isAttemptView && selectable.length));
  el("selCount").textContent = S.selected.size;
  el("selAll").checked = selectable.length > 0 && selectable.every(x => S.selected.has(x.rowId));

  el("list").innerHTML = items.length
    ? items.map(x => rowHtml(x, a)).join("")
    : `<div class="empty">Nothing here.</div>`;
}

el("tabs").onclick = e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  const key = b.dataset.view;
  if (S.senior) {
    if (TOP_OF[S.view] === key) return;   // already on this tab: keep its sub-screen
    resetView(SENIOR_SUBS[key].length ? SENIOR_SUBS[key][0][0] : key);
  } else {
    resetView(key);
  }
  render();
};

el("subtabs").onclick = e => {
  const b = e.target.closest("button[data-view]");
  if (!b || b.dataset.view === S.view) return;
  resetView(b.dataset.view);
  render();
};

// ----- selection -----
el("selAll").onchange = e => {
  const a = assessById(S.assessId);
  if (!a) return;
  const rows = S.data.attempts.filter(x => x.assessmentId === a.id);
  listFor(S.view, rows).filter(x => canAct(x, a)).forEach(x => {
    if (e.target.checked) S.selected.add(x.rowId); else S.selected.delete(x.rowId);
  });
  render();
};

el("bulkApply").onclick = async () => {
  const v = el("bulkVal").value;
  const ids = [...S.selected];
  if (!ids.length) return msg("Select at least one student.", true);
  if (!v) return msg("Choose Pass, Fail or Absent first.", true);

  let result = v === "Pass" ? "Pass" : v === "Fail" ? "Fail" : "Absent (unexcused)";
  let excuse = "";
  let comment = "";
  if (v === "Absent") {
    const ans = prompt(`Absent for ${ids.length} student(s).\nType the sick-leave reference if they are excused, or leave empty if not excused:`);
    if (ans === null) return;
    excuse = ans.trim();
    result = excuse ? "Absent (excused)" : "Absent (unexcused)";
  }
  if (v === "Fail") {
    comment = await askText(`Why did ${ids.length} student(s) fail?`,
      "The same reason is saved for each selected student. For different reasons, use Fail on each row.");
    if (!comment) return;
  }
  if (!confirm(`${result} for ${ids.length} student(s)?`)) return;

  try {
    msg("Saving…");
    const out = await call(act("recordMany"), { rowIds: ids, result, excuse, comment });
    S.selected = new Set();
    el("bulkVal").value = "";
    await reload();
    msg(`Saved ${out.done}.` + (out.skipped.length ? ` Skipped ${out.skipped.length}: ${out.skipped[0]}` : ""), out.skipped.length > 0 && out.done === 0);
  } catch (err) {
    msg(err.message, true);
  }
};

// ----- rows -----
// Chip shows the state; Attempt D reads as final
function statusChip(x) {
  if (x.trial === "D" && x.status === "Failed") return `<span class="chip bad">FAILED (final)</span>`;
  if (x.status === "Passed") return `<span class="chip good">PASSED</span>`;
  if (x.status === "On hold") return `<span class="chip">ON HOLD · Senior decides</span>`;
  return `<span class="chip">${esc(x.status)}</span>`;
}

function rowHtml(x, a) {
  const date = a.dates[x.trial] || "";
  const actionable = canAct(x, a);
  const pick = actionable
    ? `<input type="checkbox" class="pick" data-id="${esc(x.rowId)}" ${S.selected.has(x.rowId) ? "checked" : ""}>`
    : "";

  let actions = "";
  if (x.status === "Disputed" || x.status === "On hold") {
    actions = !S.senior ? `<span class="chip">Waiting for Senior</span>`
      : canEdit() ? decideButtons(x) : "";
  } else if (actionable) {
    actions = S.absentPick === x.rowId ? absentPicker(x) : recordButtons(x);
  } else if (x.status === "Open" && date && date > S.data.today && !S.senior) {
    actions = `<span class="chip">Opens ${esc(date)}</span>`;
  } else if (x.status === "Waiting") {
    actions = `<span class="chip">Waiting${date ? " · opens " + esc(date) : ""}</span>`;
  }

  const details = [
    `Attempt ${esc(x.trial)}`,
    date ? `date ${esc(date)}` : "",
    x.result ? `last: ${esc(x.result)}` : "",
    x.excuse ? `sick-leave ref: ${esc(x.excuse)}` : "",
    x.dispute ? `dispute: ${esc(x.dispute)}` : "",
    x.comment ? `reason: ${esc(x.comment)}` : ""
  ].filter(Boolean).join(" · ");

  return `<div class="row">
    <div class="who">
      ${pick}
      <div>
        <div class="name">${esc(x.student)}</div>
        <div class="meta">${details} ${statusChip(x)}</div>
      </div>
    </div>
    <div class="actions">${actions}</div>
  </div>`;
}

function recordButtons(x) {
  return `
    <button class="pass" data-act="rec" data-id="${esc(x.rowId)}" data-res="Pass">Pass</button>
    <button class="fail" data-act="rec" data-id="${esc(x.rowId)}" data-res="Fail">Fail</button>
    <button class="abs" data-act="absent" data-id="${esc(x.rowId)}">Absent</button>
    ${S.senior ? "" : `<button class="dis" data-act="dispute" data-id="${esc(x.rowId)}">Dispute</button>`}`;
}

// After "Absent": choose excused or not. Both go to the Senior.
function absentPicker(x) {
  return `
    <button class="hold" data-act="absentYes" data-id="${esc(x.rowId)}">Excused (sick leave)</button>
    <button class="abs" data-act="absentNo" data-id="${esc(x.rowId)}">Not excused</button>
    <button class="ghost" data-act="absentCancel">Cancel</button>`;
}

// Senior decides Pass or Fail on On hold and Disputed attempts
function decideButtons(x) {
  return `
    <button class="pass" data-act="decide" data-id="${esc(x.rowId)}" data-res="Pass">Pass</button>
    <button class="fail" data-act="decide" data-id="${esc(x.rowId)}" data-res="Fail">Fail</button>`;
}

// ----- Assessments (Senior only) -----
// One table per stage. Each row is one competency, and its parallel classes sit side by side.
function stageOpt(key) { return STAGE_OPTIONS.find(s => s.key === key) || STAGE_OPTIONS[0]; }

// The competencies of a stage, in code order
function stageComps(st) {
  return (S.data.competencies || []).filter(st.match)
    .sort((p, q) => p.code.localeCompare(q.code, undefined, { numeric: true }));
}

// Index of the copy's row for this competency and class, or -1
function assignedIndex(code, cls) {
  return S.manage.assessments.findIndex(a => a.competency === code && a.cls === cls);
}

// Short date for the table: "20 Nov"
function fmtDay(ymd) {
  return ymd ? new Date(ymd + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "UTC" }) : "";
}

// Attempts A to D, shown on hover so the table stays short
function datesTitle(dA) {
  return dA
    ? `A ${fmtDay(dA)} · B ${fmtDay(addDays(dA, 1))} · C ${fmtDay(addDays(dA, 2))} · D ${fmtDay(addDays(dA, 3))}`
    : "Set the Attempt A date";
}

// The stage buttons across the top
function stageTabsHtml(st) {
  return `<div class="stageTabs">${STAGE_OPTIONS.map(s =>
    `<button data-act="stage" data-key="${s.key}" class="${s.key === st.key ? "on" : ""}">${esc(s.key)}</button>`).join("")}</div>`;
}

// Progress for the stage: how many competencies are assigned to every class of it
function progressHtml(st, comps) {
  const fully = comps.filter(c => st.classes.every(cls => assignedIndex(c.code, cls) !== -1)).length;
  const missing = comps.filter(c => st.classes.some(cls => assignedIndex(c.code, cls) === -1));
  const pct = comps.length ? Math.round(fully / comps.length * 100) : 0;
  return `<div class="card" style="padding:10px 14px">
    <div class="meta"><b>${esc(st.label)}</b> · ${fully} of ${comps.length} competencies assigned to every class</div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <div class="meta" style="margin-top:6px">${missing.length
      ? "Not yet assigned: " + missing.map(c => esc(c.code)).join(", ")
      : "All competencies of this stage are assigned."}</div>
  </div>`;
}

function assessHtml() {
  if (!canEdit()) return readOnlyAssess();
  manageInit();
  const st = stageOpt(S.stage);
  const comps = stageComps(st);

  let html = `<div class="newBar">${stageTabsHtml(st)}<button data-act="aNew">+ New assessment</button></div>`;
  html += progressHtml(st, comps);
  if (S.newAsm) html += newAssessForm();
  if (!comps.length) return html + `<div class="empty">No competencies in this stage.</div>`;

  const head = `<tr><th>Code</th><th>Competency</th>${st.classes.map(c => `<th>${esc(c)}</th>`).join("")}<th></th></tr>`;
  const body = comps.map(c => {
    const cells = st.classes.map(cls => {
      const i = assignedIndex(c.code, cls);
      if (i === -1) return `<td><span class="meta">Not assigned</span></td>`;
      const a = S.manage.assessments[i];
      return `<td><div class="cell">
          <select data-k="assessments" data-i="${i}" data-f="teacher">${teacherOpts(a.teacher)}</select>
          <input type="date" data-k="assessments" data-i="${i}" data-f="dA" value="${esc(a.dA)}" title="${esc(datesTitle(a.dA))}">
          <button class="ghost xs" data-act="aRemove" data-i="${i}" title="Remove this class">×</button>
        </div></td>`;
    }).join("");
    const hasMissing = st.classes.some(cls => assignedIndex(c.code, cls) === -1);
    return `<tr><td class="code">${esc(c.code)}</td>
      <td title="${esc(c.nameAr)}">${esc(c.name)}</td>${cells}
      <td>${hasMissing ? `<button class="ghost xs" data-act="aAssign" data-code="${esc(c.code)}">Assign</button>` : ""}</td></tr>`;
  }).join("");

  html += `<div class="tableWrap"><table class="dash assess">${head}${body}</table></div>`;
  if (S.dirty) html += `<div style="margin-top:8px"><button data-act="aSave">Save changes</button></div>`;
  html += `<div class="meta" style="margin-top:6px">Hover a date to see Attempts B, C and D. A class cannot be removed once it has results.</div>`;
  return html;
}

// The New assessment form. Only classes that are still missing for the competency are shown.
function newAssessForm() {
  const st = stageOpt(S.newAsm.stage);
  const code = S.newAsm.code || "";
  const comps = stageComps(st).filter(c => st.classes.some(cls => assignedIndex(c.code, cls) === -1));
  const open = code ? st.classes.filter(cls => assignedIndex(code, cls) === -1) : [];

  let body;
  if (!code) {
    body = `<div class="meta">Choose a competency. It is assigned to ${st.classes.map(esc).join(" and ")}.</div>`;
  } else if (!open.length) {
    body = `<div class="meta">Already assigned to every class of this stage.</div>`;
  } else {
    body = open.map(cls => `<div class="mrow">
        <span class="clsName">${esc(cls)}</span>
        <select id="naT_${keyOf(cls)}">${teacherOpts("")}</select>
        <label style="margin:0">Attempt A <input type="date" id="naD_${keyOf(cls)}"></label>
      </div>`).join("") + `<div class="meta">Attempts B, C and D follow on the next days.</div>`;
  }

  return `<div class="card">
    <div class="name">New assessment</div>
    <div class="mrow" style="margin-top:10px">
      <label style="margin:0">Stage <select id="naStage">${STAGE_OPTIONS.map(s =>
        `<option value="${s.key}" ${s.key === st.key ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select></label>
      <label style="margin:0; flex:1">Competency <select id="naComp" class="wide">
        <option value="">Choose competency</option>
        ${comps.map(c => `<option value="${esc(c.code)}" ${c.code === code ? "selected" : ""}>${esc(c.code)} · ${esc(c.name)}</option>`).join("")}
      </select></label>
    </div>
    <div style="margin-top:8px">${body}</div>
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap">
      ${open.length ? `<button data-act="aAdd">Add assessment</button>` : ""}
      <button class="ghost" data-act="aCancel">Cancel</button>
    </div>
  </div>`;
}

// A past year: the same tables, read-only
function readOnlyAssess() {
  const st = stageOpt(S.stage);
  const comps = stageComps(st);
  const body = comps.map(c => {
    const cells = st.classes.map(cls => {
      const a = S.data.assessments.find(x => x.competency === c.code && x.cls === cls);
      return `<td>${a ? `${esc(a.teacher)} · ${esc(fmtDay(a.dates.A))}` : `<span class="meta">Not assigned</span>`}</td>`;
    }).join("");
    return `<tr><td class="code">${esc(c.code)}</td><td>${esc(c.name)}</td>${cells}</tr>`;
  }).join("");
  const head = `<tr><th>Code</th><th>Competency</th>${st.classes.map(c => `<th>${esc(c)}</th>`).join("")}</tr>`;
  return `<div class="newBar">${stageTabsHtml(st)}</div>
    <div class="empty">${esc(S.data.year)} is a past year. Read-only.</div>
    <div class="tableWrap"><table class="dash assess">${head}${body}</table></div>`;
}

// Teacher: the assessments assigned to me, with counts of students
function myAssessHtml() {
  const rows = S.data.assessments.slice().sort((p, q) =>
    classRank(p.cls) - classRank(q.cls) || p.competency.localeCompare(q.competency, undefined, { numeric: true }));
  if (!rows.length) return `<div class="empty">No assessments are assigned to you.</div>`;

  const head = `<tr><th>Competency</th><th>Class</th><th>Attempt A</th><th>Open now</th><th>Waiting for Senior</th><th>Passed</th><th>Failed final</th><th></th></tr>`;
  const body = rows.map(a => {
    const mine = S.data.attempts.filter(x => x.assessmentId === a.id);
    const count = pred => new Set(mine.filter(pred).map(x => x.student)).size;
    return `<tr>
      <td><div class="name">${esc(compName(a.competency))}</div><div class="sub">${esc(a.competency)}</div></td>
      <td>${esc(a.cls)}</td>
      <td>${esc(fmtDay(a.dates.A))}</td>
      <td>${count(x => x.status === "Open")}</td>
      <td>${count(x => x.status === "On hold" || x.status === "Disputed")}</td>
      <td>${count(x => x.status === "Passed")}</td>
      <td>${count(x => x.trial === "D" && x.status === "Failed")}</td>
      <td><button class="ghost xs" data-act="goAssess" data-id="${esc(a.id)}">Open</button></td>
    </tr>`;
  }).join("");
  return `<div class="tableWrap"><table class="dash">${head}${body}</table></div>`;
}

// ----- Dashboard (Senior only) -----
// Three ways to read the same data: by class, by stage, and by academic year.
// The screen and the Excel export are both built from the same blocks, so they always match.

// Blocks for one mode. Each row has one cell per column; a null cell means that
// competency is not assigned to the student's class.
function dashBlocks(mode) {
  const students = S.data.students || [];
  const asm = S.data.assessments || [];
  if (mode === "class") {
    const classes = [...new Set([...students.map(s => s.cls), ...asm.map(a => a.cls)].filter(Boolean))]
      .sort((p, q) => classRank(p) - classRank(q) || p.localeCompare(q));
    return classes.map(c => {
      const list = asm.filter(a => a.cls === c);
      const names = students.filter(s => s.cls === c).map(s => s.name).sort();
      return {
        title: `${c} · ${names.length} students`,
        sheet: c,
        showClass: false,
        cols: list.map(a => ({ label: compName(a.competency) || a.name, code: a.competency, dA: a.dates.A })),
        rows: names.map(n => ({ name: n, cls: c, cells: list.slice() }))
      };
    });
  }
  return STAGE_OPTIONS.map(st => {
    const studs = students.filter(s => st.classes.includes(s.cls))
      .sort((p, q) => classRank(p.cls) - classRank(q.cls) || p.name.localeCompare(q.name));
    const codes = [...new Set(asm.filter(a => st.classes.includes(a.cls)).map(a => a.competency))]
      .sort((p, q) => p.localeCompare(q, undefined, { numeric: true }));
    return {
      title: `${st.label} · ${studs.length} students`,
      sheet: st.label.replace(/\s*\(.*\)$/, ""),
      showClass: true,
      cols: codes.map(code => ({ label: compName(code) || code, code, dA: null })),
      rows: studs.map(s => ({
        name: s.name,
        cls: s.cls,
        cells: codes.map(code => asm.find(a => a.competency === code && a.cls === s.cls) || null)
      }))
    };
  });
}

// Passed results and assigned students for each column of a block
function blockTotals(b) {
  return b.cols.map((c, i) => {
    const cells = b.rows.filter(r => r.cells[i]);
    const passed = cells.filter(r => cellState(r.name, r.cells[i]).kind === "good").length;
    return { passed, of: cells.length };
  });
}

function exportBar(mode, note) {
  return `<div class="exportBar"><button data-act="export" data-mode="${esc(mode)}">Export to Excel</button>` +
    `<span class="meta">${esc(note)} · for the board</span></div>`;
}

function dashboardHtml(mode) {
  const blocks = dashBlocks(mode);
  const bar = exportBar(mode, mode === "class" ? "one sheet per class" : "one sheet per stage");
  if (!blocks.some(b => b.rows.length)) {
    return bar + `<div class="empty">No students in this year yet. Open Settings to add students, then Assessments.</div>`;
  }
  return bar + blocks.map(b => {
    const title = `<h3 class="mh">${esc(b.title)}</h3>`;
    if (!b.rows.length) return title + `<div class="empty">No students in this block yet.</div>`;
    if (!b.cols.length) return title + `<div class="empty">No competencies assigned yet.</div>`;
    const head = `<tr><th>Student</th>${b.showClass ? "<th>Class</th>" : ""}${b.cols.map(c =>
      `<th>${esc(c.label)}<div class="sub">${esc(c.code)}${c.dA ? " · A " + esc(c.dA) : ""}</div></th>`).join("")}</tr>`;
    const body = b.rows.map(r =>
      `<tr><td class="sname">${esc(r.name)}</td>${b.showClass ? `<td>${esc(r.cls)}</td>` : ""}` +
      r.cells.map(a => `<td>${cellHtml(r.name, a)}</td>`).join("") + `</tr>`).join("");
    const totals = `<tr class="tot"><td>Passed</td>${b.showClass ? "<td></td>" : ""}${blockTotals(b).map(t =>
      `<td>${t.passed} / ${t.of}</td>`).join("")}</tr>`;
    return title + `<div class="tableWrap"><table class="dash">${head}${body}${totals}</table></div>`;
  }).join("");
}

// What one student shows for one competency, as text and a colour kind
function cellState(name, a) {
  const mine = S.data.attempts.filter(x => x.assessmentId === a.id && x.student === name);
  if (!mine.length) return { kind: "none", text: "—" };
  const passed = mine.find(x => x.status === "Passed");
  if (passed) return { kind: "good", text: `Passed · Attempt ${passed.trial}` };
  if (mine.some(x => x.trial === "D" && x.status === "Failed")) return { kind: "bad", text: "Failed final" };
  const current = mine
    .filter(x => ["Open", "On hold", "Disputed"].indexOf(x.status) !== -1)
    .sort((p, q) => p.trial < q.trial ? -1 : 1)[0];
  if (current) {
    return { kind: "", text: current.status === "Open" ? `Attempt ${current.trial} open` : `Attempt ${current.trial} · with Senior` };
  }
  return { kind: "none", text: "Waiting" };
}

function cellHtml(name, a) {
  if (!a) return `<span class="meta">Not assigned</span>`;
  const s = cellState(name, a);
  if (s.kind === "none") return `<span class="meta">${esc(s.text)}</span>`;
  return `<span class="chip ${s.kind}">${esc(s.text)}</span>`;
}

// ----- Requests (Senior only): holds and disputes across the whole year -----
function requestsHtml() {
  const pending = S.data.attempts.filter(x => x.status === "On hold");
  const disputes = S.data.attempts.filter(x => x.status === "Disputed");
  if (!pending.length && !disputes.length) return `<div class="empty">Nothing is waiting for a decision.</div>`;
  const group = (title, list) => {
    if (!list.length) return "";
    const sorted = list.slice().sort((p, q) => p.student.localeCompare(q.student));
    return `<h3 class="mh">${esc(title)} · ${list.length}</h3>` + sorted.map(x => {
      const a = assessById(x.assessmentId);
      if (!a) return "";
      return `<div class="meta" style="margin-top:8px">${esc(assessLabel(a))}</div>` + rowHtml(x, a);
    }).join("");
  };
  return group("On hold (Senior decides)", pending) + group("Disputed", disputes);
}

// ----- History by academic year: one summary row per year -----
// Loads each year once; the cache is cleared whenever the data reloads.
async function loadYears() {
  if (S.yearLoading) return;
  S.yearLoading = true;
  try {
    const out = [];
    for (const y of S.data.years) {
      const d = y.year === S.data.year ? S.data : await call("seniorData", { year: y.year });
      out.push({
        year: y.year,
        status: y.status,
        students: (d.students || []).length,
        assessments: (d.assessments || []).length,
        passed: d.attempts.filter(x => x.status === "Passed").length,
        failed: d.attempts.filter(x => x.trial === "D" && x.status === "Failed").length,
        pending: d.attempts.filter(x => x.status === "On hold" || x.status === "Disputed").length
      });
    }
    S.yearCache = out;
  } catch (err) {
    msg(err.message, true);
  } finally {
    S.yearLoading = false;
  }
  if (S.view === "hist-year") render();
}

function yearTable(rows) {
  const head = `<tr><th>Academic year</th><th>Status</th><th>Students</th><th>Competencies assigned</th><th>Passed (results)</th><th>Failed final</th><th>Waiting for Senior</th></tr>`;
  const body = rows.map(r =>
    `<tr><td class="sname">${esc(r.year)}</td><td>${esc(r.status)}</td><td>${r.students}</td><td>${r.assessments}</td>` +
    `<td>${r.passed}</td><td>${r.failed}</td><td>${r.pending}</td></tr>`).join("");
  return exportBar("year", "one sheet, one row per year") +
    `<div class="tableWrap"><table class="dash">${head}${body}</table></div>`;
}

// ----- Settings: class overview -----
function classesHtml() {
  const students = S.data.students || [];
  const asm = S.data.assessments || [];
  const classes = [...new Set([...CLASS_ORDER, ...students.map(s => s.cls), ...asm.map(a => a.cls)].filter(Boolean))]
    .sort((p, q) => classRank(p) - classRank(q) || p.localeCompare(q));
  const head = `<tr><th>Class</th><th>Stage</th><th>Students</th><th>Competencies</th><th>Assessors</th></tr>`;
  const body = classes.map(c => {
    const st = STAGE_OPTIONS.find(s => s.classes.includes(c));
    const list = asm.filter(a => a.cls === c);
    const teachers = [...new Set(list.map(a => a.teacher).filter(Boolean))];
    return `<tr><td class="sname">${esc(c)}</td><td>${esc(st ? st.label : "—")}</td>` +
      `<td>${students.filter(s => s.cls === c).length}</td><td>${list.length}</td>` +
      `<td>${teachers.length ? esc(teachers.join(", ")) : `<span class="meta">none yet</span>`}</td></tr>`;
  }).join("");
  return `<p class="meta">Classes of this year. To move a student, change their class in Teachers & students. Assessors are set on Assessments.</p>` +
    `<div class="tableWrap"><table class="dash">${head}${body}</table></div>`;
}

// ----- Excel export (.xlsx, built in the browser; no library needed) -----
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

// A zip file with no compression, which is what .xlsx files are made of
function zipFiles(files) {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);      // names are UTF-8
    lh.setUint16(12, 0x21, true);       // file date 1980-01-01
    lh.setUint32(14, crc, true);
    lh.setUint32(18, size, true);
    lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, size, true);
    ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  const cdSize = central.reduce((n, u) => n + u.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)],
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

const XML_HEAD = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n`;
const XLSX_NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
const XLSX_REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function colName(i) {
  let s = "";
  for (let n = i + 1; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s;
  return s;
}

// sheet = { name, rows: [[...]], bold: [row indexes] }
function sheetXml(sheet) {
  const width = Math.max(1, ...sheet.rows.map(r => r.length));
  const rowsXml = sheet.rows.map((r, ri) => {
    const style = sheet.bold.includes(ri) ? ` s="1"` : "";
    const cells = r.map((v, ci) => {
      const ref = colName(ci) + (ri + 1);
      if (v === null || v === undefined || v === "") return "";
      if (typeof v === "number") return `<c r="${ref}"${style}><v>${v}</v></c>`;
      return `<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join("");
  return XML_HEAD + `<worksheet xmlns="${XLSX_NS}"><cols><col min="1" max="${width}" width="22" customWidth="1"/></cols>` +
    `<sheetData>${rowsXml}</sheetData></worksheet>`;
}

function xlsxBlob(sheets) {
  const enc = new TextEncoder();
  const used = new Set();
  const names = sheets.map((s, i) => {
    const base = String(s.name).replace(/[\[\]:*?\/\\]/g, "-").slice(0, 31) || `Sheet${i + 1}`;
    let name = base;
    let k = 2;
    while (used.has(name.toLowerCase())) name = base.slice(0, 28) + " " + k++;
    used.add(name.toLowerCase());
    return name;
  });
  const sheetRels = sheets.map((_, i) =>
    `<Relationship Id="rId${i + 1}" Type="${XLSX_REL}/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("");
  const files = [
    { name: "[Content_Types].xml", data: enc.encode(XML_HEAD +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") +
      `<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>` +
      `</Types>`) },
    { name: "_rels/.rels", data: enc.encode(XML_HEAD +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="${XLSX_REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`) },
    { name: "xl/workbook.xml", data: enc.encode(XML_HEAD +
      `<workbook xmlns="${XLSX_NS}" xmlns:r="${XLSX_REL}"><sheets>` +
      names.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") +
      `</sheets></workbook>`) },
    { name: "xl/_rels/workbook.xml.rels", data: enc.encode(XML_HEAD +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheetRels}` +
      `<Relationship Id="rId${sheets.length + 1}" Type="${XLSX_REL}/styles" Target="styles.xml"/></Relationships>`) },
    { name: "xl/styles.xml", data: enc.encode(XML_HEAD +
      `<styleSheet xmlns="${XLSX_NS}">` +
      `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>` +
      `<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>` +
      `<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>` +
      `<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>` +
      `<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>` +
      `<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>` +
      `</styleSheet>`) },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc.encode(sheetXml({ ...s, name: names[i] })) }))
  ];
  return zipFiles(files);
}

// The sheets for one export. Returns null while the academic-year summary is still loading.
function sheetsFor(mode) {
  if (mode === "year") {
    if (!S.yearCache) return null;
    const header = ["Academic year", "Status", "Students", "Competencies assigned", "Passed (results)", "Failed final", "Waiting for Senior"];
    const rows = [[`Academic years summary`], [], header,
      ...S.yearCache.map(r => [String(r.year), r.status, r.students, r.assessments, r.passed, r.failed, r.pending])];
    return [{ name: "By academic year", rows, bold: [0, 2] }];
  }
  return dashBlocks(mode).filter(b => b.rows.length).map(b => {
    const totals = blockTotals(b);
    const header = ["Student", ...(b.showClass ? ["Class"] : []),
      ...b.cols.map(c => c.label + (c.code ? " (" + c.code + ")" : ""))];
    const body = b.rows.map(r => [r.name, ...(b.showClass ? [r.cls] : []),
      ...r.cells.map(a => a ? cellState(r.name, a).text : "Not assigned")]);
    const foot = ["Passed", ...(b.showClass ? [""] : []), ...totals.map(t => `${t.passed} / ${t.of}`)];
    const rows = [[`${b.title} · academic year ${S.data.year}`], [], header, ...body, foot];
    return { name: b.sheet, rows, bold: [0, 2, rows.length - 1] };
  });
}

function exportDashboard(mode) {
  const sheets = sheetsFor(mode);
  if (!sheets) return msg("Still loading the academic years. Try again in a moment.", true);
  if (!sheets.length) return msg("Nothing to export yet.", true);
  const blob = xlsxBlob(sheets);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const what = mode === "year" ? "academic-years" : mode === "class" ? "by-class" : "by-stage";
  a.href = url;
  a.download = `EVA-${what}-${S.data.year}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  msg(`Exported ${sheets.length} sheet(s).`);
}

// ----- Manage tab (Senior only): teachers and students of the year on screen -----
// Edits a copy of the lists in S.manage. Assessments are edited on their own tab, and the
// two share one copy, so a save sends everything together.
function manageInit() {
  if (S.manage) return;
  S.manage = {
    teachers: S.data.teachers.map(t => ({ name: t.name, pin: t.pin })),
    students: S.data.students.map(s => ({ name: s.name, cls: s.cls })),
    assessments: S.data.assessments.map(a => ({
      id: a.id, cls: a.cls, competency: a.competency || "", teacher: a.teacher, dA: a.dates.A || ""
    }))
  };
}

// Assessor choices come from the Teachers list
function teacherOpts(sel) {
  manageInit();
  return ['<option value="">Choose assessor</option>']
    .concat(S.manage.teachers.map(t => t.name).filter(Boolean)
      .map(n => `<option value="${esc(n)}" ${n === sel ? "selected" : ""}>${esc(n)}</option>`))
    .join("");
}

function manageHtml() {
  if (!canEdit()) return readOnlyManage();
  manageInit();
  const m = S.manage;
  const classNames = [...new Set(CLASS_ORDER.concat(m.students.map(s => s.cls)).filter(Boolean))];

  const teachers = m.teachers.map((t, i) => `
    <div class="mrow">
      <input data-k="teachers" data-i="${i}" data-f="name" value="${esc(t.name)}" placeholder="Name">
      <input data-k="teachers" data-i="${i}" data-f="pin" value="${esc(t.pin)}" placeholder="PIN (4 to 6 digits)" inputmode="numeric">
      <button class="ghost" data-act="mDel" data-k="teachers" data-i="${i}">Remove</button>
    </div>`).join("");

  const students = m.students.map((s, i) => `
    <div class="mrow">
      <input data-k="students" data-i="${i}" data-f="name" value="${esc(s.name)}" placeholder="Student name">
      <input data-k="students" data-i="${i}" data-f="cls" value="${esc(s.cls)}" placeholder="Class" list="clsList">
      <button class="ghost" data-act="mDel" data-k="students" data-i="${i}">Remove</button>
    </div>`).join("");

  const bulkStudents = `
    <div class="bulkBox">
      <label>Class for these students</label>
      <input id="bulkCls" type="text" list="clsList" placeholder="e.g. Wheeler 2">
      <datalist id="clsList">${classNames.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
      <label>Paste names, one per line. To set the class per line, write "Name, Class".</label>
      <textarea id="bulkNames" placeholder="Ahmed Ali&#10;Sara Mostafa&#10;Omar Hassan, Senior 1 - Utilities"></textarea>
      <div style="margin-top:8px"><button class="ghost" data-act="mBulk">Add to list</button></div>
      <div class="meta" style="margin-top:6px">Names already in the list for the same class are skipped. Press Save all changes after adding.</div>
    </div>`;

  return `
    <h3 class="mh">Teachers</h3>${teachers}
    <button class="ghost" data-act="mAdd" data-k="teachers">+ Add teacher</button>

    <h3 class="mh">Students (${esc(S.data.year)})</h3>${bulkStudents}${students}
    <button class="ghost" data-act="mAdd" data-k="students">+ Add student</button>

    <div style="margin-top:16px"><button data-act="aSave">Save all changes</button></div>
    <div class="meta" style="margin-top:8px">Removing a student is refused if they already have recorded results.</div>`;
}

// A past year: show what it contains, nothing to change
function readOnlyManage() {
  return `<div class="empty">${esc(S.data.year)} is a past year. Its lists and results are read-only.</div>
    <h3 class="mh">Students</h3><div class="empty">${S.data.students.length} students.</div>`;
}

// Typing and picking update the copy in memory (no redraw, so the cursor stays)
function manageField(e) {
  const t = e.target;
  const k = t.dataset.k;
  if (!k || !S.manage) return;
  const i = Number(t.dataset.i);
  const f = t.dataset.f;
  const row = S.manage[k] && S.manage[k][i];
  if (!row || !f) return;
  row[f] = t.value;
  S.dirty = true;
}

// Paste many students at once. "Name" uses the class box; "Name, Class" sets it per line.
function bulkAddStudents() {
  const cls = el("bulkCls").value.trim();
  const lines = el("bulkNames").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  let skipped = 0;
  const keep = [];

  lines.forEach(line => {
    const parts = line.split(/[,\t]/).map(s => s.trim());
    const name = parts[0];
    const c = parts.length >= 2 && parts[1] ? parts[1] : cls;
    if (!name) return;
    if (!c) { keep.push(line); return; }
    const dup = S.manage.students.some(s =>
      s.name.toLowerCase() === name.toLowerCase() && s.cls.toLowerCase() === c.toLowerCase());
    if (dup) { skipped++; return; }
    S.manage.students.push({ name: name, cls: c });
    added++;
  });

  render();
  el("bulkNames").value = keep.join("\n");
  el("bulkCls").value = cls;
  const note = keep.length ? ` ${keep.length} line(s) need a class and were kept in the box.` : "";
  msg(`Added ${added}. Skipped ${skipped} already in the list.${note} Press Save all changes.`, keep.length > 0);
}

// Saves teachers, students and assessments of the year on screen. The copy is kept if the save fails.
async function saveAll() {
  manageInit();
  const m = S.manage;
  try {
    msg("Saving…");
    await call("seniorSave", {
      year: S.year,
      teachers: m.teachers,
      students: m.students,
      assessments: m.assessments.map(a => ({ id: a.id, cls: a.cls, competency: a.competency, teacher: a.teacher, dA: a.dA }))
    });
    S.manage = null;
    S.newAsm = null;
    S.dirty = false;
    await reload();
    msg("Saved.");
  } catch (err) {
    msg(err.message, true);
  }
}

async function manageClick(b) {
  manageInit();
  const k = b.dataset.k;
  const i = Number(b.dataset.i);
  if (b.dataset.act === "mBulk") return bulkAddStudents();
  if (b.dataset.act === "aSave") return saveAll();
  if (b.dataset.act === "mAdd") {
    S.manage[k].push(k === "teachers" ? { name: "", pin: "" } : { name: "", cls: "" });
    render();
  }
  if (b.dataset.act === "mDel") {
    if (!confirm("Remove this row? It is saved when you press Save all changes.")) return;
    S.manage[k].splice(i, 1);
    render();
  }
}

// Assessments tab buttons
async function assessClick(b) {
  manageInit();
  const i = Number(b.dataset.i);
  const a = b.dataset.act;
  if (a === "stage") {
    S.stage = b.dataset.key;
    if (S.newAsm) S.newAsm = { stage: S.stage, code: "" };
    return render();
  }
  if (a === "aNew") { S.newAsm = { stage: S.stage, code: "" }; return render(); }
  if (a === "aAssign") {
    S.newAsm = { stage: S.stage, code: b.dataset.code };
    render();
    return window.scrollTo(0, 0);
  }
  if (a === "aCancel") { S.newAsm = null; return render(); }
  if (a === "aSave") return saveAll();
  if (a === "aRemove") {
    if (!confirm("Remove this class from the assessment? It is saved when you press Save changes.")) return;
    S.manage.assessments.splice(i, 1);
    S.dirty = true;
    return render();
  }
  if (a === "aAdd") {
    const st = stageOpt(S.newAsm.stage);
    const code = el("naComp") ? el("naComp").value : "";
    if (!code) return msg("Choose a competency.", true);
    const classes = st.classes.filter(cls => assignedIndex(code, cls) === -1);
    if (!classes.length) return msg("Already assigned to every class of this stage.", true);
    const rows = classes.map(cls => ({
      id: "", cls: cls, competency: code,
      teacher: el("naT_" + keyOf(cls)).value,
      dA: el("naD_" + keyOf(cls)).value
    }));
    if (rows.some(r => !r.teacher)) return msg("Choose an assessor for each class.", true);
    if (rows.some(r => !r.dA)) return msg("Set the Attempt A date for each class.", true);
    S.manage.assessments.push(...rows);
    S.newAsm = null;
    return saveAll();
  }
}

// ----- row actions (attempt lists, Assessments and Manage) -----
el("list").onclick = async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  if (b.dataset.act === "export") return exportDashboard(b.dataset.mode);
  if (b.dataset.act === "goAssess") {
    S.assessId = b.dataset.id;
    el("assess").value = S.assessId;
    resetView("A");
    return render();
  }
  if (S.view === "set-people") return manageClick(b);
  if (S.view === "assess") return assessClick(b);

  const act_ = b.dataset.act;
  const id = b.dataset.id;
  const x = id ? S.data.attempts.find(r => r.rowId === id) : null;

  try {
    if (act_ === "absent") { S.absentPick = id; render(); return; }
    if (act_ === "absentCancel") { S.absentPick = null; render(); return; }

    if (act_ === "absentYes" || act_ === "absentNo") {
      let excuse = "";
      if (act_ === "absentYes") {
        excuse = (prompt("Sick-leave note reference:") || "").trim();
        if (!excuse) return;
      }
      const result = act_ === "absentYes" ? "Absent (excused)" : "Absent (unexcused)";
      if (!confirm(`${x.student} · Attempt ${x.trial}\n${result}. It goes to the Senior to decide Pass or Fail.`)) return;
      msg("Saving…");
      await call(act("record"), { rowId: id, result, excuse });
      S.absentPick = null;
      await reload();
      msg("Saved. Sent to the Senior.");
      return;
    }

    if (act_ === "dispute") {
      const note = await askText("Reason for dispute",
        `${x.student} · Attempt ${x.trial}. The attempt freezes until the Senior decides.`);
      if (!note) return;
      msg("Sending dispute…");
      await call("dispute", { rowId: id, note });
      await reload();
      msg("Dispute sent. The attempt is frozen until the Senior decides.");
      return;
    }

    if (act_ === "rec") {
      const res = b.dataset.res;
      let comment = "";
      if (res === "Fail") {
        comment = await askText("Why did the student fail?", `${x.student} · Attempt ${x.trial}`);
        if (!comment) return;
      } else if (!confirm(`${x.student} · Attempt ${x.trial}\n→ ${res}?`)) {
        return;
      }
      msg("Saving…");
      await call(act("record"), { rowId: id, result: res, comment });
      await reload();
      msg("Saved.");
      return;
    }

    if (act_ === "decide") {
      const res = b.dataset.res;
      let comment = "";
      if (res === "Fail") {
        comment = await askText("Why did the student fail?", `${x.student} · Attempt ${x.trial}`);
        if (!comment) return;
      } else if (!confirm(`${x.student} · Attempt ${x.trial}\n→ ${res}?`)) {
        return;
      }
      msg("Saving…");
      await call("seniorDecide", { rowId: id, result: res, comment });
      await reload();
      msg("Saved.");
      return;
    }
  } catch (err) {
    msg(err.message, true);
  }
};

// Typing updates memory only; a change (select, date, or leaving a field) also redraws the rows
el("list").oninput = e => {
  if (S.view === "set-people" || S.view === "assess") manageField(e);
};

el("list").onchange = e => {
  // New assessment form: the stage decides which competencies are offered
  if (e.target.id === "naStage") {
    S.stage = e.target.value;
    S.newAsm = { stage: S.stage, code: "" };
    return render();
  }
  if (e.target.id === "naComp") { S.newAsm.code = e.target.value; return render(); }

  if (S.view === "set-people" || S.view === "assess") {
    if (e.target.dataset.k) { manageField(e); render(); }   // only fields of the copy, never the bulk box
    return;
  }
  if (!e.target.classList.contains("pick")) return;
  const id = e.target.dataset.id;
  if (e.target.checked) S.selected.add(id); else S.selected.delete(id);
  render();
};

// ----- start -----
(async function start() {
  const saved = sessionStorage.getItem("trials");
  if (!saved) return;
  Object.assign(S, JSON.parse(saved));
  if (S.senior) resetView("assess");

  // Show the last data straight away, then refresh it in the background
  const cached = sessionStorage.getItem("trialsData");
  if (cached) {
    S.data = JSON.parse(cached);
    showApp();
    msg("Updating…");
  }
  try {
    S.data = await loadData();
    if (S.senior) S.year = S.data.year;
    if (!S.senior) S.teacher = S.data.teacher;
    persistData();
    saveSession();
    showApp();
    msg("");
  } catch (e) {
    if (!cached) {
      sessionStorage.removeItem("trials");
      S.senior = null;
    } else {
      msg("Could not refresh. Showing the last loaded data.", true);
    }
  }
})();
</script>
</body>
</html>
